name: Feature request
description: Propose a small, concrete improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Keep the proposal scoped. Do not include secrets or private task text.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: false
